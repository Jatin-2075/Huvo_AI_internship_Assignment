<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northstar Homes — Chat with Null</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16212c;
    --accent: #d99a4e;
    --accent-2: #4e8ad9;
    --text: #e8edf2;
    --muted: #8a97a3;
    --bubble-user: #24384a;
    --bubble-bot: #1c2a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid #223141;
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
    border-left: 2px solid var(--accent);
  }
  .msg.system {
    align-self: center;
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
  }
  footer {
    padding: 14px 16px;
    border-top: 1px solid #223141;
    background: var(--panel);
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2b3d4f;
    background: #0f1720;
    color: var(--text);
    font-size: 14.5px;
  }
  input[type="text"]:focus { outline: 1px solid var(--accent-2); }
  button {
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #send { background: var(--accent-2); color: white; }
  #end { background: #3a2b23; color: var(--accent); }
  #analytics {
    display: none;
    margin: 16px 20px;
    padding: 14px;
    background: var(--panel);
    border-radius: 10px;
    font-size: 13px;
    white-space: pre-wrap;
    border: 1px solid #223141;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Northstar Homes</h1>
    <p>Chatting with Null · Project Northstar One, Sector 79, Gurugram</p>
  </header>

  <div id="chat"></div>
  <div id="analytics"></div>

  <footer>
    <input id="input" type="text" placeholder="Type a message… (English / Hindi / Hinglish)" />
    <button id="send">Send</button>
    <button id="end">End &amp; Analyze</button>
  </footer>
</div>

<script>
let sessionId = null;

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const analyticsEl = document.getElementById("analytics");

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

addMsg("Hi! I'm Null from Northstar Homes. How can I help you today — looking for a 2 BHK or 3 BHK at Northstar One?", "bot");

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  addMsg(text, "user");

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) {
      const err = await res.json();
      addMsg("Error: " + (err.detail || res.statusText), "system");
      return;
    }
    const data = await res.json();
    sessionId = data.session_id;
    addMsg(data.reply, "bot");
  } catch (e) {
    addMsg("Network error: " + e.message, "system");
  }
}

async function endConversation() {
  if (!sessionId) {
    addMsg("Nothing to end yet — send a message first.", "system");
    return;
  }
  addMsg("Ending conversation and generating analytics…", "system");
  const res = await fetch("/api/end", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId }),
  });
  const data = await res.json();
  analyticsEl.style.display = "block";
  analyticsEl.textContent = "Lead Analytics:\n\n" + JSON.stringify(data.analytics, null, 2);
  inputEl.disabled = true;
  document.getElementById("send").disabled = true;
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("end").addEventListener("click", endConversation);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>
</body>
</html>
